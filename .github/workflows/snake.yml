name: Generate Snake Animation

on:
  schedule:
    # Executa automaticamente a cada 12 horas
    - cron: "0 */12 * * *"
  
  # Permite executar manualmente pela aba Actions a qualquer momento
  workflow_dispatch:
  
  # Executa também a cada push na branch principal
  push:
    branches:
    - main
    - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: TheoEnderson
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-dracula.svg?color_snake=#bd93f9&color_dots=#282a36,#44475a,#6272a4,#8be9fd,#50fa7b

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
